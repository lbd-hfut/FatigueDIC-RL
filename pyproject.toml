[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fatigue-dic-rl"
version = "0.1.0"
description = "Mesh-aware mechanics and DIC contracts for fatigue damage research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
neural = ["torch>=2.2"]
test = ["pytest>=7"]
mechanics = ["scipy>=1.10"]
verification = ["scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["scientific: analytic identities and physical invariants"]
