[study]
scope = "DEVELOPMENT_ONLY; no independent qualification test"
seeds = [240000, 240001, 240002]
families = ["matched", "parameter", "S1"]
Q = 16
sigma_mm = 5e-5
max_nfev = 40
workers = 4
cycle_step = 2.0
maximum_damage = 0.6
maximum_nominal_stress = 35.0
forecast_offsets = [10.0, 60.0, 160.0]

[protocols]
short_cycles = [0.0, 10.0, 20.0]
long_cycles = [0.0, 30.0, 60.0]
dense_cycles = [0.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0]
multilevel_amplitudes = [1.0, 0.4, 0.7]
multilevel_R = [-1.0, -1.0, 0.0]
multilevel_boundaries = [0.0, 20.0, 40.0, 60.0]
future_amplitude = 0.4
future_R = -1.0
reaction_sigma_N = 0.01
reaction_cost_per_scalar = 2
high_noise_sigma_mm = 2.5e-4
information_only = ["dense_history", "spatial_noise", "high_noise"]

[bounded_profiles]
targets = ["B2:m", "B5:c1"]
m_grid = [0.7, 0.925, 1.15, 1.375, 1.6]
c1_grid = [-3.0, -1.5, 0.0, 1.5, 3.0]
max_nfev = 30
initial_d0_controls = [0.05, 0.22]
state_E_grid = [1600.0, 1850.0, 2100.0, 2350.0, 2550.0]

[stopping]
practical_singular_threshold = 3.0
minimum_projected_separation = 3.0
expansion = "NONE this turn, regardless of pilot result"
model_rules = "Call original B7 and E9 functions without changed thresholds; changed history timing is explicitly a protocol transfer, not inherited qualification."
formal_independent_tests = false
uncertainty_qualification = "NOT QUALIFIED; no coverage calibration"
